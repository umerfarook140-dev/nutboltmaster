jobs:
  build:
    runs-on: ubuntu-latest
    
    # Agar aapka code kisi subfolder mein hai (e.g., 'android')
    defaults:
      run:
        working-directory: ./android   # Apne folder ka naam yahan likhein

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug
